source = /usr/share/silicaos/theme/hyprlock.conf

general {
    ignore_empty_input = true
}

background {
    monitor =
    color = $color
    path = /usr/share/silicaos/theme/background.png
    blur_passes = 3
}

input-field {
    monitor =
    size = 650, 100
    position = 0, 0
    halign = center
    valign = center
    inner_color = $inner_color
    outer_color = $outer_color
    outline_thickness = 4
    font_family = JetBrainsMono Nerd Font
    font_color = $font_color
    placeholder_text = Enter Password
    rounding = 0
    fade_on_empty = false
}
